services:
  api:
    build: .
    ports:
      - "8086:8000"
    volumes:
      - ./data:/app/data
      - ${REPOS_DIR:-$HOME/repos}:/repos
    environment:
      - DATA_DIR=/app/data
      - REPOS_DIR=/repos
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL:-}
      - NTFY_TOPIC=${NTFY_TOPIC:-}
      - HOMELAB_REPO_STATUS_ALERT_LOG=${HOMELAB_REPO_STATUS_ALERT_LOG:-/app/data/alerts.log}
